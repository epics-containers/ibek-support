# get all system dependencies

- name: System block
  tags: [system]
  when: not skip_apt
  block:
    # Refresh the apt index at most once per container build. The sentinel
    # alone is not enough: a generic IOC built FROM another generic IOC
    # (e.g. ioc-pmac from ioc-asyn) inherits the base image's sentinel and
    # its stale index, and Ubuntu removes superseded package versions,
    # giving 404s. So also refresh if the sentinel is older than
    # apt_cache_valid_minutes or the package lists have been cleaned.
    - name: Check whether the apt package index is fresh
      ansible.builtin.shell: >
        find /tmp/.apt_cache_updated -mmin -{{ apt_cache_valid_minutes }} |
        grep -q . &&
        ls /var/lib/apt/lists | grep -q Packages
      register: apt_cache_fresh
      changed_when: false
      failed_when: false
      when: is_linux

    - name: Update apt cache once per container build
      ansible.builtin.apt:
        update_cache: true
      when:
        - is_linux
        - apt_cache_fresh.rc != 0

    - name: Create apt cache sentinel
      ansible.builtin.file:
        path: /tmp/.apt_cache_updated
        state: touch
        mode: "0644"
      when:
        - is_linux
        - apt_cache_fresh.rc != 0
      changed_when: false

    - name: Download additional files for {{ module }}
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop: "{{ download_extras }}"

    - name: Install system dependencies from registries {{ module }}
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ apt_developer }}"
      when:
        - not item.startswith('/')
        - is_linux

    - name: Install local system dependencies {{ module }}
      ansible.builtin.package:
        deb: "{{ item }}"
        state: present
      loop: "{{ apt_developer }}"
      ignore_errors: true # local packages may already be installed
      when:
        - item.startswith('/')
        - is_linux

    - name: Register system dependencies for the runtime stage {{ module }}
      ansible.builtin.lineinfile:
        path: "{{ configure_folder }}/runtime_debs"
        # note \Q...\E is used to escape the string
        regexp: "^{{ item | regex_escape() }}$"
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop: "{{ apt_runtime }}"
      when: is_linux
