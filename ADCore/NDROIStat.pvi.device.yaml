label: NDROIStat
children:

- type: Include
  file_name: NDPluginBase

- type: Group
  name: TimeSeries
  label: Time Series
  layout:
    type: Grid
    labelled: true
  children:

  - type: SignalW
    name: TSControl
    write_pv: $(P)$(R)TSControl
    write_widget:
      type: ComboBox

  - type: SignalR
    name: TSAcquiring
    read_pv: $(P)$(R)TSAcquiring
    read_widget:
      type: LED

  - type: SignalW
    name: TSNumPoints
    label: TS Num Points
    write_pv: $(P)$(R)TSNumPoints
    write_widget:
      type: TextWrite

  - type: SignalR
    name: TSCurrentPoint
    label: TS Current Point
    read_pv: $(P)$(R)TSCurrentPoint
    read_widget:
      type: TextRead

- type: Group
  name: Reset
  layout:
    type: Grid
    labelled: true
  children:

  - type: SignalW
    name: ResetAll
    label: Reset All
    write_pv: $(P)$(R)ResetAll
    write_widget:
      type: ToggleButton
