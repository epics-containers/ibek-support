# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: pvaDriver

entity_models:
  - name: pvaDetector
    description: |-
      Creates a pvAccess detector
    parameters:
      P:
        type: str
        description: Device Prefix
      R:
        type: str
        description: Device Suffix
      PORT:
        type: id
        description: Port name for the detector
      PVNAME:
        type: str
        description: PV Name
      BUFFERS:
        type: int
        description: Maximum number of NDArray buffers to be created for plugin callbacks
        default: 50
      MEMORY:
        type: int
        description: Max memory to allocate, should be maxw*maxh*nbuffer for driver and all attached plugins
        default: 0
      PRIORITY:
        type: int
        description: Max buffers to allocate
        default: 0
      STACKSIZE:
        type: int
        description: Max buffers to allocate
        default: 0
      TIMEOUT:
        type: int
        description: Timeout
        default: 1
      ADDR:
        type: int
        description: Asyn Port address
        default: 0

      ATTRIBUTES_FILE:
        type: str
        description: |-
          NDAttributes XML to attach to each NDArray. Preferred: the XML itself,
          inline (XMLSIZE grows to fit it). Alternative: a file name in the IOC
          instance's config folder, or an absolute path. Empty sets nothing.
          See ADCore.NDAttributesConfig.
        default: ""

      ATTRIBUTES_MACROS:
        type: str
        description: |-
          Macro substitutions for the NDAttributes XML, e.g. "P=BL01T-EA-DET-01:,R=CAM:".
          At most 255 characters. Empty sets nothing. See ADCore.NDAttributesConfig.
        default: ""

      XMLSIZE:
        type: int
        description: |-
          Number of characters in the NDAttributesFile waveform record.
          Grown automatically to fit inline XML in ATTRIBUTES_FILE; a larger
          value given here wins.
        default: 256

    pre_init:
      - value: |
          # pvaDriverConfig(portName, pvName, maxBuffers, maxMemory, priority, stackSize)
          pvaDriverConfig("{{PORT}}", {{PVNAME}}, {{BUFFERS}}, {{MEMORY}}, {{PRIORITY}}, {{STACKSIZE}})

    sub_entities:
      - type: ADCore.NDAttributesConfig
        P: "{{ P }}"
        R: "{{ R }}"
        ATTRIBUTES_FILE: "{{ ATTRIBUTES_FILE }}"
        ATTRIBUTES_MACROS: "{{ ATTRIBUTES_MACROS }}"

    databases:
      - file: $(PVADRIVER)/db/pvaDriver.template
        args:
          XMLSIZE: "{{ [XMLSIZE, ATTRIBUTES_FILE.split() | join(' ') | length + 1 if '<Attributes>' in ATTRIBUTES_FILE else 0] | max }}"
          P:
          R:
          PORT:
          TIMEOUT:
          ADDR:

    pvi:
      yaml_path: pvaDriver.pvi.device.yaml
      ui_macros:
        P:
        R:
      pv_prefix: "$(P)$(R)"
