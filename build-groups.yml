# Module build groups for parallel CI builds.
#
# Each group builds independently in its own Docker container, FROM the
# Dockerfile.ci default base (epics-base-developer). Groups must list their
# modules in dependency order.
#
# "deps" names groups whose modules are built first, in the same container.
# "base_image" is a full image reference that overrides the default base.
#
# Any module with a *.install.yml that is NOT listed in any group
# is automatically assigned to the "uncategorized" group, which builds on
# "core". This ensures new modules are always tested without manual config
# updates.
#
# Modules listed in "skip" are excluded from all CI builds.
#
# Run `python _scripts/build_matrix.py` to see the generated matrix
# and check for uncategorized modules.

skip:
  - pvaDriver
  # vdct is a build time tool, not a support module: there is no repo to
  # clone and no make to run, so the standard role must not run against it.
  # It is installed with 'ansible.sh vdct --tags system,pre_build_tasks' by
  # the generic IOCs that need it. See vdct/README.md.
  - vdct

groups:
  core:
    desc: "Core EPICS support modules (dependencies for most others)"
    modules:
      - iocStats
      - sequencer
      - sscan
      - calc
      - asyn
      - busy
      - autosave
      - pvlogging

  motor:
    desc: "Motor stack"
    deps: [core]
    modules:
      - motor
      - motorMotorSim
      - motorNewport
      - pmac
      - optics

  adcore:
    desc: "ADCore and the plugins most area detector IOCs use"
    deps: [core]
    modules:
      - ADCore
      - ffmpegServer

  # AD modules split in two for better parallelism
  areadetector1:
    desc: "Area detector stack 1"
    deps: [adcore]
    modules:
      - ADURL
      - ADZMQ
      - ADUVC
      - quadEM
      - slsDetector

  areadetector2:
    desc: "Area detector stack 2"
    deps: [adcore]
    modules:
      - ADGenICam
      - ADAravis
      - ADSimDetector
      - ADAndor
      - ADAndor3
      - xspress3

  general:
    desc: "General-purpose modules with few dependencies"
    deps: [core]
    modules:
      - std
      - modbus
      - opcua
      - positioner

  fieldbus:
    desc: "Fieldbus and simple protocol modules"
    deps: [core]
    modules:
      - StreamDevice
      - snmp
      - ether_ip
      - FINS
      - digitelMpc
      - lakeshore340
      - mks937a
      - mks937b
      - oxCryo
      - terminalserver
