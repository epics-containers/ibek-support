# yaml-language-server: $schema=../_scripts/support_install_variables.json

# VisualDCT - https://github.com/epics-extensions/VisualDCT
#
# This is a build time only TOOL, not a support module: there is nothing to
# clone and nothing to make. Install it with the system and pre_build_tasks
# tags only:
#
#   COPY ibek-support/vdct/ vdct
#   RUN ansible.sh vdct --tags system,pre_build_tasks
#
# It provides 'flatdb', which flattens VDCT .vdb files into msi compatible
# .template files, plus the EPICS build rules that invoke it. Any support
# module holding .vdb files can then be built from pristine upstream sources
# instead of a pre-converted fork.
#
# It also provides 'check-db', which flatdb runs on its own output and which
# is worth running again over the installed database tree at the end of a
# container build:
#
#   RUN check-db /epics/support/*/db/*.template /epics/support/*/db/*.db
#
# A build can damage a database file after flatdb has finished with it - a
# dlsPLC build once shipped a template truncated at 48KiB and a second one at
# zero bytes - and a partial template still expands cleanly through msi, so
# the fault only surfaces as a half populated IOC at dbLoadRecords time.
#
# The JRE and the jar are declared in apt_developer / installed under
# /usr/local, so they live in the developer stage only. Nothing here is
# registered as a runtime asset, so the runtime image is unchanged.

module: vdct
version: 2.8.4

apt_developer:
  - openjdk-21-jre-headless

download_extras:
  - url: https://github.com/epics-extensions/VisualDCT/releases/download/v{{ version }}/VisualDCT-{{ version }}-distribution.tar.gz
    dest: /tmp/VisualDCT-distribution.tar.gz

tasks:
  - path: vdct-tasks.yml
