# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: ffmpegServer
# JSouter's fix to bypass scaling skip for mono 8 bit images
version: 3d192ed
dbds:
  - ffmpegServer.dbd
libs:
  - ffmpegServer

organization: http://github.com/DiamondLightSource

apt_developer:
  - libavcodec-dev
  - libswscale-dev
  - libavformat-dev

apt_runtime:
  - libavcodec62
  - libswscale9
  - libavformat62

comment_out:
  # don't build the vendor libraries
  - path: Makefile
    regexp: vendor
  - path: ffmpegServerApp/src/Makefile
    regexp: vendor\/ffmpeg

patch_lines:
  # use external ffmpeg libraries
  - path: ffmpegServerApp/src/Makefile
    regexp: LIB_LIBS \+= avdevice
    line: ffmpegServer_SYS_LIBS += avformat avcodec swresample swscale avutil
  # FFmpeg 7+ removed AV_INPUT_BUFFER_MIN_SIZE, which ffmpegServer.cpp uses
  # as the smallest image to encode. Supply its old value (16384) rather than
  # patching the source.
  - path: ffmpegServerApp/src/Makefile
    regexp: AV_INPUT_BUFFER_MIN_SIZE
    line: USR_CPPFLAGS += -DAV_INPUT_BUFFER_MIN_SIZE=16384
