# yaml-language-server: $schema=../schemas/ibek.support.schema.json

# TODO - I intend to have iterable sub-entities at which point we should use
# those instead of Moxa16 / Moxa32 etc.
# @Max Herbert - what you did with Jinja is also fine but I want my ioc.db for
# the IOC defined here to match the auto converted traditional IOC
# https://gitlab.diamond.ac.uk/controls/containers/accelerator/sr-va/-/tree/main/services/sr03-va-ioc-01

module: terminalServer

entity_models:
  - name: MoxaChannel
    description: |-
      Root object for Moxa terminal server channel
    parameters:
      name:
        type: id
        description: |-
          Object name
      P:
        type: str
        description: |-
          PV prefix
      R:
        type: str
        description: |-
          PV suffix
      CHAN:
        type: int
        description: |-
          Channel number
      HOST:
        type: str
        description: |-
          Host IP address

    databases:
      - file: $(TERMINALSERVER)/db/MoxaChannel.template
        args:
          name:
          P:
          R:
          CHAN:
          HOST:

  - name: Moxa16
    description: |-
      Root object for Moxa terminal server
    parameters:
      name:
        type: id
        description: |-
          Object name
      P:
        type: str
        description: |-
          PV prefix
      R:
        type: str
        description: |-
          PV suffix
        default: ""
      HOST:
        type: str
        description: |-
          Host IP address
      NCHANS:
        type: int
        description: |-
          Number of channels

    sub_entities:
      # one channel per NCHANS; see the module's NCHANS parameter
      - type: ibek.repeat
        variable: chan
        values: "{{ range(1, NCHANS + 1) | list }}"
        entity:
          type: terminalServer.MoxaChannel
          name: "{{ name }}_{{ chan }}"
          P: "{{ P }}"
          R: "{{ R }}"
          CHAN: "{{ chan }}"
          HOST: "{{ HOST }}"

    databases:
      - file: $(TERMINALSERVER)/db/TerminalServer16.template
        args:
          name:
          P:
          R:

      - file: $(TERMINALSERVER)/db/Moxa.template
        args:
          name: |
            {{ name + "_top" }}
          P:
          R:
          HOST:

  - name: Moxa32
