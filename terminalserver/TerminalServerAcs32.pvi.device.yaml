# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# Upstream DiamondLightSource/terminalserver at 2-7: Acs.template and TerminalServer32.template
# for the server, with one AcsChannel screen per channel. A server with fewer than 32
# channels (NCHANS) shows the rest disconnected, as its templates hold 32.

label: TerminalServerAcs32
children:
- type: Include
  file_name: TerminalServerInfo

- type: Group
  name: Channels
  layout:
    type: Grid
    labelled: true
  children:
  - type: Group
    name: Channel1
    label: Channel 1
    layout:
      type: Row
      header:
      - Alias
      - Match
      - Edit
    children:
    - type: SignalR
      name: Alias1
      read_pv: $(P)$(R):1:ALIAS
      read_widget:
        type: TextRead
        format: string
    - type: SignalR
      name: Match1
      read_pv: $(P)$(R):1:MATCH
      read_widget:
        type: LED
    - type: DeviceRef
      name: Edit
      label: Edit
      pv: $(P)$(R):PVI
      ui: AcsChannel.pvi.bob
      macros:
        P: $(P)$(R)
        R: ''
        CHAN: '1'
