# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# Upstream DiamondLightSource/terminalserver at 2-7: the current settings of each of 32
# channels, read from MoxaChannel.template or AcsChannel.template. Included by the server
# screens.

