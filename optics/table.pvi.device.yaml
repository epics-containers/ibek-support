- type: Group
  name: General
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalW
    name: Stop
    label: Stop
    write_pv: $(P)$(Q):stop
    write_widget:
      type: ButtonPanel
      actions:
        Stop: '1'
  - type: SignalR
    name: Done
    label: Done
    read_pv: $(P)$(Q):done
    read_widget:
      type: LED
  - type: SignalR
    name: FieldLvio
    label: Limit Violation
