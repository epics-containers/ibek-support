# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# An optical table, from upstream optics R2-14 table.db and tableRecord.dbd, with groups from
# upstream's table_full.adl, table_limits.adl and table_fixedPoints.adl screens. The motor
# records themselves belong to their own devices, so this shows the table record's copy of them.

label: table
children:
- type: Group
  name: Axes
  layout:
    type: Grid
    labelled: true
  children:
  - type: Group
    name: AxisX
    label: X
    layout:
      type: Row
      header:
      - Demand
      - Encoder
      - Low Limit
      - High Limit
    children:
    - type: SignalW
      name: FieldX
      write_pv: $(P)$(T).X
      write_widget:
        type: TextWrite
    - type: SignalR
      name: FieldEx
      read_pv: $(P)$(T).EX
      read_widget:
        type: TextRead
    - type: SignalR
      name: FieldLlx
      read_pv: $(P)$(T).LLX
      read_widget:
        type: TextRead
    - type: SignalR
      name: FieldHlx
      read_pv: $(P)$(T).HLX
