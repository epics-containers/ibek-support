# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json
# Grouped from the DLS EDM screen defaultIFB300.edl (mrfioc2 2-2-0dls6).
# Generated from that screen. Hand edits may be overwritten by regeneration.

label: defaultPCIe
children:
- type: Group
  name: Details
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: Linkstat
    read_pv: $(device):LINKSTAT
    read_widget:
      type: LED
  - type: SignalR
    name: Rxerr
    label: RX Error count
    read_pv: $(device):RXERR
    read_widget:
      type: TextRead
  - type: SignalR
    name: Linkerr
    label: Link Error count
    read_pv: $(device):LINKERR
    read_widget:
      type: TextRead
  - type: Group
    name: RowEventClock
    label: Event Clk (MHz)
    layout:
      type: Row
    children:
    - type: SignalR
      name: EventClock
      read_pv: $(device):EVENT:CLOCK
      read_widget:
        type: TextRead
    - type: SignalW
      name: EventClockS
      write_pv: $(device):EVENT:CLOCK:S
      write_widget:
        type: TextWrite
  - type: SignalRW
    name: LinkRxmodeS
    label: Link type
    write_pv: $(device):LINK:RXMODE:S
    write_widget:
      type: ToggleButton
    read_pv: $(device):LINK:RXMODE:S
    read_widget:
      type: LED
  - type: Group
    name: RowModels
    label: Model / FW
    layout:
      type: Row
    children:
    - type: SignalR
      name: Models
      read_pv: $(device):MODELS
      read_widget:
        type: TextRead
        format: string
    - type: SignalR
      name: Firmware
      read_pv: $(device):FIRMWARE
      read_widget:
        type: TextRead
        format: string
  - type: Group
    name: RowTimevalid
    label: Time
    layout:
      type: Row
    children:
    - type: SignalR
      name: Timevalid
      read_pv: $(device):TIMEVALID
      read_widget:
        type: LED
    - type: SignalR
      name: Time
      read_pv: $(device):TIME
      read_widget:
        type: TextRead
        format: string
  - type: SignalW
    name: TimeSrcselS
    label: Time Source
    write_pv: $(device):TIME:SRCSEL:S
    write_widget:
      type: ComboBox
  - type: SignalR
    name: TimeClock
    label: Tick Rate (MHz)
    read_pv: $(device):TIME:CLOCK
    read_widget:
      type: TextRead
  - type: SignalR
    name: Pllstat
    label: Link Status
    read_pv: $(device):PLLSTAT
    read_widget:
      type: LED
  - type: SignalR
    name: Fifoerr
    label: FIFO Error count
    read_pv: $(device):FIFOERR
    read_widget:
      type: TextRead
  - type: SignalR
    name: FifoerrRate
    label: FIFO Error rate
    read_pv: $(device):FIFOERR:RATE
    read_widget:
      type: TextRead
  - type: SignalR
    name: TimeDiv
    label: Time Divider
    read_pv: $(device):TIME:DIV
    read_widget:
      type: TextRead
  - type: Group
    name: RowEnableS
    label: PLL Status
    layout:
      type: Row
    children:
    - type: SignalRW
      name: EnableS
      write_pv: $(device):ENABLE:S
      write_widget:
        type: ToggleButton
      read_pv: $(device):ENABLE:S
      read_widget:
        type: LED
    - type: SignalR
      name: Enable
      read_pv: $(device):ENABLE
      read_widget:
        type: LED
- type: Group
  name: Details2
  label: Details
  layout:
    type: Grid
