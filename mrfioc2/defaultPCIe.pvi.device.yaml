- type: Group
  name: SfpInfo
  label: SFP Info
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: TransceiverStatus
    label: Transceiver Status
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalR
      name: SfpTemp
      label: Temperature (C)
      read_pv: $(device):SFP:TEMP
      read_widget:
        type: TextRead
    - type: SignalR
      name: SfpTxpow
      label: Tx Power (uW)
      read_pv: $(device):SFP:TXPOW
