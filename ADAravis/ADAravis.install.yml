# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: ADAravis
version: R2-3

dbds:
  - ADAravisSupport.dbd
libs:
  - ADAravis

organization: http://github.com/areaDetector

apt_developer:
  - libxext-dev
  - libglib2.0-dev
  - libusb-1.0-0-dev
  - libxml2-dev
  - libx11-dev
  - meson
  - intltool
  - pkg-config
  - xz-utils

apt_runtime:
  - libglib2.0-bin
  - libusb-1.0-0
  - libxml2-16
  - aravis-tools-cli

  # incorrecly placed macro does not get overriden by RELEASE.local. Remove it.
comment_out:
  - path: configure/RELEASE
    regexp: "ADGENICAM"

patch_blocks:
  - path: "{{ config_linux_host }}"
    block: |
      CHECK_RELEASE=WARN
      AREA_DETECTOR=/epics/support
      CROSS_COMPILER_TARGET_ARCHS =
      GLIBPREFIX=/usr
      GLIB_MULTIARCH := $(shell gcc -dumpmachine)
      USR_INCLUDES += -I$(GLIBPREFIX)/include/glib-2.0
      USR_INCLUDES += -I$(GLIBPREFIX)/lib/$(GLIB_MULTIARCH)/glib-2.0/include/
      glib-2.0_DIR = $(GLIBPREFIX)/lib/$(GLIB_MULTIARCH)
      ARAVIS_INCLUDE  = /usr/local/include/aravis-0.8/

tasks:
  - path: arvlib_task.yml

# copy the aravis library built above to the runtime stage (meson installs
# it under the Debian multiarch libdir, e.g. /usr/local/lib/aarch64-linux-gnu)
runtime_files:
  - "/usr/local/lib/{{ multiarch_triplet }}"
