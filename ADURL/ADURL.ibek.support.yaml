# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: ADURL

entity_models:
  - name: URLDriver
    description: |-
      This plugin creates a URLDriver object
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      R:
        type: str
        description: |-
          Device Suffix
      PORT:
        type: id
        description: |-
          Port name for the plugin
      ADDR:
        type: str
        description: |-
          Asyn Port address
      TIMEOUT:
        type: str
        description: |-
          Timeout
      SCANRATE:
        type: enum
        description: |-
          Specified scan rate for cpu intensive PVs
        default: I/O Intr
        values:
          .1 second:
          .2 second:
          .5 second:
          1 second:
          2 second:
          5 second:
          10 second:
          I/O Intr:
          Event:
          Passive:
      BUFFERS:
        type: int
        description: |-
          Maximum number of NDArray buffers to be created for plugin callbacks
        default: 10
      MEMORY:
        type: int
        description: |-
          Max memory to allocate, should be maxw*maxh*nbuffer for driver and all attached plugins
        default: 0

      ATTRIBUTES_FILE:
        type: str
        description: |-
          NDAttributes XML to attach to each NDArray. A file name in the IOC
          instance's config folder, an absolute path, or the XML inline (at most
          255 characters). Empty sets nothing. See ADCore.NDAttributesConfig.
        default: ""

      ATTRIBUTES_MACROS:
        type: str
        description: |-
          Macro substitutions for the NDAttributes XML, e.g. "P=BL01T-EA-DET-01:,R=CAM:".
          Empty sets nothing. See ADCore.NDAttributesConfig.
        default: ""

    sub_entities:
      - type: ADCore.NDAttributesConfig
        P: "{{ P }}"
        R: "{{ R }}"
        ATTRIBUTES_FILE: "{{ ATTRIBUTES_FILE }}"
        ATTRIBUTES_MACROS: "{{ ATTRIBUTES_MACROS }}"

    databases:
      - file: $(ADURL)/db/URLDriver.template
        args:
          P:
          R:
          PORT:
          ADDR:
          TIMEOUT:
          SCANRATE:

    pre_init:
      - value: |
          # URLDriverConfig(portName, maxBuffers, maxMemory)
          URLDriverConfig("{{PORT}}", {{BUFFERS}}, {{MEMORY}})
