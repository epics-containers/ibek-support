# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# A group of inverted magnetron gauges, from mks937bImgGroup.template at mks937b 3-1-0.
# The relay numbers come from the entity's macros, as in the template.

label: mks937bImgGroup
children:
- type: Group
  name: Details
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: P
    label: Pressure (mbar)
    read_pv: $(device):P
    read_widget:
      type: TextRead
  - type: SignalR
    name: Sta
    label: Status
    read_pv: $(device):STA
    read_widget:
      type: TextRead
- type: Group
  name: General
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: CchvState
    label: Cold Cathode
    read_pv: $(device):CCHV
    read_widget:
      type: LED
  - type: SignalR
    name: Switching
    label: Switching
    read_pv: $(device):SWITCHING
    read_widget:
      type: LED
- type: Group
  name: Interlocks
  label: Interlocks
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: Details2
    label: Details
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalR
      name: ProSp
      label: IMG Overpressure
      read_pv: $(device):PRO:SP
      read_widget:
        type: TextRead
    - type: SignalR
      name: ValveSp
      label: Valve Interlock
      read_pv: $(device):RLY$(valveIlRelay):SP
      read_widget:
        type: TextRead
    - type: SignalR
      name: Mps1Sp
      label: MPS Interlock 1
      read_pv: $(device):RLY$(mpsIlRelay1):SP
      read_widget:
        type: TextRead
    - type: SignalR
      name: Mps2Sp
      label: MPS Interlock 2
      read_pv: $(device):RLY$(mpsIlRelay2):SP
      read_widget:
        type: TextRead
    - type: SignalR
      name: RgaSp
      label: RGA Interlock
      read_pv: $(device):RLY$(rgaIlRelay):SP
      read_widget:
        type: TextRead
    - type: SignalR
      name: FrlySp
      label: Fast Valve Interlock
      read_pv: $(device):FRLY:SP
      read_widget:
        type: TextRead
- type: Group
  name: MoreDetails
  label: More Details
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: Details3
    label: Details
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalR
      name: Plog
      label: Log Pressure
      read_pv: $(device):PLOG
      read_widget:
        type: TextRead
    - type: SignalR
      name: Pmax
      label: Max Pressure
      read_pv: $(device):PMAX
      read_widget:
        type: TextRead
    - type: SignalR
      name: Pmin
      label: Min Pressure
      read_pv: $(device):PMIN
      read_widget:
        type: TextRead
- type: Group
  name: ProtectedControls
  label: Protected Controls
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: ColdCathode
    label: Off trips the machine if open to the Front End
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: Cchv
      label: Cold Cathode
      write_pv: $(device):CCHV
      write_widget:
        type: ToggleButton
      read_pv: $(device):CCHV
      read_widget:
        type: LED
  - type: Group
    name: Setpoints
    label: Interlock Setpoints
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: ProOutsp
      label: IMG Overpressure
      write_pv: $(device):PRO:OUTSP
      write_widget:
        type: TextWrite
      read_pv: $(device):PRO:SP
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ValveSetsp
      label: Valve Interlock
      write_pv: $(device):RLY$(valveIlRelay):SETSP
      write_widget:
        type: TextWrite
      read_pv: $(device):RLY$(valveIlRelay):SP
      read_widget:
        type: TextRead
    - type: SignalRW
      name: Mps1Setsp
      label: MPS Interlock 1
      write_pv: $(device):RLY$(mpsIlRelay1):SETSP
      write_widget:
        type: TextWrite
      read_pv: $(device):RLY$(mpsIlRelay1):SP
      read_widget:
        type: TextRead
    - type: SignalRW
      name: Mps2Setsp
      label: MPS Interlock 2
      write_pv: $(device):RLY$(mpsIlRelay2):SETSP
      write_widget:
        type: TextWrite
      read_pv: $(device):RLY$(mpsIlRelay2):SP
      read_widget:
        type: TextRead
    - type: SignalRW
      name: RgaSetsp
      label: RGA Interlock
      write_pv: $(device):RLY$(rgaIlRelay):SETSP
      write_widget:
        type: TextWrite
      read_pv: $(device):RLY$(rgaIlRelay):SP
      read_widget:
        type: TextRead
    - type: SignalRW
      name: FrlySetsp
      label: Fast Valve Interlock
      write_pv: $(device):FRLY:SETSP
      write_widget:
        type: TextWrite
      read_pv: $(device):FRLY:SP
      read_widget:
        type: TextRead
