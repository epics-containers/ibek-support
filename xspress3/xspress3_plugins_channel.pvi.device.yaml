# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json
# Grouped from the DLS EDM screen xspress_mca.edl (xspress3 3-2-1).
# Generated from that screen. Hand edits may be overwritten by regeneration.

label: xspress3_plugins_channel
children:
- type: Group
  name: General
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalRW
    name: Enable
    write_pv: $(P):MCA$(CHAN):Enable
    write_widget:
      type: ToggleButton
    read_pv: $(P):MCA$(CHAN):Enable_RBV
    read_widget:
      type: TextRead
