# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json
# Grouped from the DLS EDM screen xspress_card.edl (xspress3 3-2-1).
# Generated from that screen. Hand edits may be overwritten by regeneration.

label: xspress3_card
children:
- type: Group
  name: Details
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: NumChannels
    label: Num Channels connected
    read_pv: $(P)$(R)FEM$(CARD_NUM):NUM_CHANNELS
    read_widget:
      type: TextRead
  - type: SignalR
    name: C0FramesReadout
    label: '0'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C0_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C2FramesReadout
    label: '2'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C2_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C4FramesReadout
    label: '4'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C4_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C6FramesReadout
    label: '6'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C6_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C8FramesReadout
    label: '8'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C8_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: DroppedFrames
    label: Frames dropped (all channels)
    read_pv: $(P)$(R)FEM$(CARD_NUM):DROPPED_FRAMES
    read_widget:
      type: TextRead
  - type: Group
    name: RowTemp0
    label: Temp0
    layout:
      type: Row
    children:
    - type: SignalR
      name: Temp0
      read_pv: $(P)$(R)FEM$(CARD_NUM):TEMP_0
      read_widget:
        type: TextRead
    - type: SignalR
      name: Temp1
      read_pv: $(P)$(R)FEM$(CARD_NUM):TEMP_1
      read_widget:
