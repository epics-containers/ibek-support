        type: TextRead
    - type: SignalR
      name: Temp5
      read_pv: $(P)$(R)FEM$(CARD_NUM):TEMP_5
      read_widget:
        type: TextRead
  - type: SignalR
    name: C1FramesReadout
    label: '1'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C1_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C3FramesReadout
    label: '3'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C3_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
    name: C5FramesReadout
    label: '5'
    read_pv: $(P)$(R)FEM$(CARD_NUM):C5_FRAMES_READOUT
    read_widget:
      type: TextRead
  - type: SignalR
