# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json
# Grouped from the DLS EDM screen xspress_dtc_plugin.edl (xspress3 3-2-1).
# Generated from that screen. Hand edits may be overwritten by regeneration.

label: xspress3_dtc_plugin
children:
- type: Group
  name: NdPluginBase
  label: NDPluginBase
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: Information
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalR
      name: PortName
      label: Port Name
      read_pv: $(P)$(R)PortName_RBV
      read_widget:
        type: TextRead
        format: string
    - type: SignalR
      name: PluginType
      label: Plugin Type
      read_pv: $(P)$(R)PluginType_RBV
      read_widget:
        type: TextRead
        format: string
  - type: Group
    name: Input
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalW
      name: NdArrayPort
      label: Array Port
      write_pv: $(P)$(R)NDArrayPort
      write_widget:
        type: TextWrite
        format: string
    - type: SignalR
      name: NdArrayPort2
      read_pv: $(P)$(R)NDArrayPort_RBV
      read_widget:
        type: TextRead
        format: string
  - type: Group
    name: ArrayProps
    label: Array Props
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalR
      name: NDimensions
      label: '# dimensions'
      read_pv: $(P)$(R)NDimensions_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: ArraySize0
      label: Dim0 Size
      read_pv: $(P)$(R)ArraySize0_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: ArraySize1
      label: Dim1 Size
      read_pv: $(P)$(R)ArraySize1_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: ArraySize2
      label: Dim2 Size
      read_pv: $(P)$(R)ArraySize2_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: DataType
      label: Data Type
      read_pv: $(P)$(R)DataType_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: ColorMode
      label: Colour Mode
      read_pv: $(P)$(R)ColorMode_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: BayerPattern
      label: Bayer Pattern
      read_pv: $(P)$(R)BayerPattern_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: UniqueId
      label: Unique ID
      read_pv: $(P)$(R)UniqueId_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: TimeStamp
      label: Time Stamp
      read_pv: $(P)$(R)TimeStamp_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Callback
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: EnableCallbacks
      label: Enable
      write_pv: $(P)$(R)EnableCallbacks
      write_widget:
        type: ToggleButton
      read_pv: $(P)$(R)EnableCallbacks_RBV
      read_widget:
        type: LED
    - type: SignalRW
      name: MinCallbackTime
      label: Min Time
      write_pv: $(P)$(R)MinCallbackTime
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)MinCallbackTime_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BlockingCallbacks
      label: Blocking
      write_pv: $(P)$(R)BlockingCallbacks
      write_widget:
        type: ToggleButton
      read_pv: $(P)$(R)BlockingCallbacks_RBV
      read_widget:
        type: LED
  - type: Group
    name: Counters
    layout:
      type: Grid
      labelled: true
    children:
    - type: Group
      name: RowArrayCounter
      label: Arrays
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ArrayCounter
        write_pv: $(P)$(R)ArrayCounter
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)ArrayCounter_RBV
        read_widget:
          type: TextRead
      - type: SignalR
        name: QueueUse
        read_pv: $(P)$(R)QueueUse
        read_widget:
          type: TextRead
    - type: SignalR
      name: ArrayRate
      read_pv: $(P)$(R)ArrayRate_RBV
      read_widget:
        type: TextRead
    - type: Group
      name: RowQueueUse
      label: Queue
      layout:
        type: Row
      children:
      - type: SignalR
        name: QueueSize
        read_pv: $(P)$(R)QueueSize
        read_widget:
          type: TextRead
    - type: SignalRW
      name: DroppedArrays
      label: Dropped
      write_pv: $(P)$(R)DroppedArrays
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DroppedArrays_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Advanced
    label: Advanced...
    layout:
      type: SubScreen
      labelled: false
    children:
    - type: Group
      name: Information2
      label: Information
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: NdArrayAddress
        label: ND Array Address
        write_pv: $(P)$(R)NDArrayAddress
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)NDArrayAddress_RBV
        read_widget:
          type: TextRead
    - type: Group
      name: Threading
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: NumThreads
        label: Num Threads
        write_pv: $(P)$(R)NumThreads
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)NumThreads_RBV
        read_widget:
          type: TextRead
      - type: SignalR
        name: MaxThreads
        label: Max Threads
        read_pv: $(P)$(R)MaxThreads_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: SortMode
        label: Sort mode
        write_pv: $(P)$(R)SortMode
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)SortMode_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: SortTime
        label: Sort time
        write_pv: $(P)$(R)SortTime
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)SortTime_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: SortSize
        label: Sort size
        write_pv: $(P)$(R)SortSize
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)SortSize_RBV
        read_widget:
          type: TextRead
      - type: SignalR
        name: SortFree
        label: Sort free
        read_pv: $(P)$(R)SortFree
        read_widget:
          type: TextRead
      - type: SignalRW
        name: DisorderedArrays
        label: Disordered
        write_pv: $(P)$(R)DisorderedArrays
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)DisorderedArrays_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: DroppedOutputArrays
        label: Dropped out
        write_pv: $(P)$(R)DroppedOutputArrays
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)DroppedOutputArrays_RBV
        read_widget:
          type: TextRead
    - type: Group
      name: Rates
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: MaxByteRate
        label: Max Byte Rate
        write_pv: $(P)$(R)MaxByteRate
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)MaxByteRate_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: MaxArrayRate
        label: Max Array Rate
        write_pv: $(P)$(R)MaxArrayRate
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)MaxArrayRate_RBV
        read_widget:
          type: TextRead
- type: Group
  name: DeadtimeCorrection
  label: Deadtime Correction
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalRW
    name: SquashAuxDim
    label: Squash Aux Dimension
    write_pv: $(P)$(R)SquashAuxDim
    write_widget:
      type: ToggleButton
    read_pv: $(P)$(R)SquashAuxDim
    read_widget:
      type: LED
  - type: SignalRW
    name: ApplyDtc
    label: Apply DTC to MCA
    write_pv: $(P)$(R)ApplyDTC
    write_widget:
      type: ToggleButton
    read_pv: $(P)$(R)ApplyDTC
    read_widget:
      type: LED
