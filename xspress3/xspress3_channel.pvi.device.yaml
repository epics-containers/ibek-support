# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json
# Grouped from the DLS EDM screen xspress_mca.edl (xspress3 3-2-1).
# Generated from that screen. Hand edits may be overwritten by regeneration.

label: xspress3_channel
children:
- type: Group
  name: XspressSca
  label: xspress_sca
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: ChannelChanScalerData
    label: Channel $(CHAN_NUM) Scaler Data
    layout:
      type: Grid
      labelled: true
    children:
    - type: Group
      name: RowSca5Value
      label: 5 Window 1
      layout:
        type: Row
      children:
      - type: SignalR
        name: Sca5Value
        read_pv: $(P)$(R)C$(CHAN_NUM)_SCA5:Value_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: Sca5Llm
        write_pv: $(P)$(R)C$(CHAN_NUM)_SCA5_LLM
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)C$(CHAN_NUM)_SCA5_LLM_RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: Sca5Hlm
        write_pv: $(P)$(R)C$(CHAN_NUM)_SCA5_HLM
        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)C$(CHAN_NUM)_SCA5_HLM_RBV
        read_widget:
          type: TextRead
    - type: Group
      name: RowSca6Value
