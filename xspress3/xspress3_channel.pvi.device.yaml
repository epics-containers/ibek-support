        write_widget:
          type: TextWrite
        read_pv: $(P)$(R)C$(CHAN_NUM)_SCA6_HLM_RBV
        read_widget:
          type: TextRead
    - type: SignalR
      name: Sca0Value
      label: 0 Time
      read_pv: $(P)$(R)C$(CHAN_NUM)_SCA0:Value_RBV
      read_widget:
        type: TextRead
    - type: SignalR
      name: Sca8Value
