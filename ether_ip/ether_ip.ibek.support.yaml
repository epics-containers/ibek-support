# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: ether_ip

entity_models:
  - name: EtherIPInit
    description: |-
      This creates an IP connection to a plc using the ether_ip driver
    parameters:
      device:
        type: str
        description: |-
          PV Prefix

      port:
        type: str
        description: |-
          Port Name

      ip:
        type: str
        description: |-
          IP Port of PLC

    pre_init:
      - when: first
        value: |2

          # EtherIP Initialisation
          drvEtherIP_init()
          # Define EtherIP to PLC connection
      - value: |
          drvEtherIP_define_PLC("{{port}}", "{{ip}}", 0)
    databases:
      - file: ether_ip_plcInfo.template
        args:
          port:
          device:

  - name: ai
    description: |-
      A single ai record reading one tag from a PLC over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_ai.template
        args:
          record:
          port:
          scan:
          tag:

  - name: ao
    description: |-
      A single ao record writing one tag to a PLC over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_ao.template
        args:
          record:
          port:
          scan:
          tag:

  - name: bi
    description: |-
      A single bi record reading one tag from a PLC over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_bi.template
        args:
          record:
          port:
          scan:
          tag:

  - name: bo
    description: |-
      A single bo record writing one tag to a PLC over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_bo.template
        args:
          record:
          port:
          scan:
          tag:

  - name: mbbiDirect
    description: |-
      A single mbbiDirect record reading a group of bits from a PLC tag
      over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      nobt:
        type: int
        description: |-
          Number of bits to read

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_mbbiDirect.template
        args:
          record:
          port:
          scan:
          tag:
          nobt:

  - name: mbboDirect
    description: |-
      A single mbboDirect record writing a group of bits to a PLC tag
      over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
          Ether_IP Port Name - the port of a companion ether_ip.EtherIPInit

      tag:
        type: str
        description: |-
          Tag to address on PLC

      nobt:
        type: int
        description: |-
          Number of bits to write

      scan:
        type: str
        description: |-
          Scan Time
        default: 1 second

    databases:
      - file: ether_ip_mbboDirect.template
        args:
          record:
          port:
          scan:
          tag:
          nobt:

  - name: stringin
    description: |-
      A single stringin record reading one tag from a PLC over ether_ip
    parameters:
      record:
        type: str
        description: |-
          Record Name

      port:
        type: str
        description: |-
