              write_pv: $(P)$(Q):PC_FILTSEL1
              write_widget:
                type: TextWrite
            - type: SignalR
              name: PcFiltsel1Str
              read_pv: $(P)$(Q):PC_FILTSEL1:STR
              read_widget:
                type: TextRead
                format: string
            - type: SignalR
