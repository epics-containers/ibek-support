        read_pv: $(P)$(Q):PC_PULSE_MAX:RBV
        read_widget:
          type: TextRead
      - type: SignalR
        name: PcPulseOut
        label: Pulse Status
        read_pv: $(P)$(Q):PC_PULSE_OUT
        read_widget:
          type: LED
    - type: Group
      name: PcCaptured
      label: Captured
      layout:
        type: Grid
        labelled: true
      children:
      - type: Group
        name: Plot
        label: Captured Data
        layout:
          type: SubScreen
          labelled: false
        children:
        - type: Group
          name: General
          label: Last Values
          layout:
            type: Grid
            labelled: true
          children:
          - type: Group
            name: RowPcEnc1Last
            label: Enc1 Last Val
            layout:
              type: Row
            children:
            - type: SignalR
              name: PcEnc1Last
              read_pv: $(P)$(Q):PC_ENC1_LAST
              read_widget:
                type: TextRead
            - type: SignalR
              name: M1Egu
              read_pv: $(P)$(Q):M1:EGU
              read_widget:
