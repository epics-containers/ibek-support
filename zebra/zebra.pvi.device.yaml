        read_widget:
          type: TextRead
      - type: SignalRW
        name: PcGateStep
        label: Gate Step
        write_pv: $(P)$(Q):PC_GATE_STEP
        write_widget:
          type: TextWrite
        read_pv: $(P)$(Q):PC_GATE_STEP:RBV
        read_widget:
          type: TextRead
      - type: SignalR
        name: PcGateOut
        label: Gate Status
        read_pv: $(P)$(Q):PC_GATE_OUT
        read_widget:
          type: LED
    - type: Group
      name: Pulse
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: PcPulseSel
        label: Trig Source
        write_pv: $(P)$(Q):PC_PULSE_SEL
