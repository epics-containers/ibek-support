        write_widget:
          type: TextWrite
        read_pv: $(P)$(Q):PC_PULSE_STEP:RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: PcPulseDly
        label: Capt Delay
        write_pv: $(P)$(Q):PC_PULSE_DLY
        write_widget:
          type: TextWrite
        read_pv: $(P)$(Q):PC_PULSE_DLY:RBV
        read_widget:
