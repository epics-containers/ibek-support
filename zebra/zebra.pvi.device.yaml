# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# Upstream DiamondLightSource/zebra at 84b69db, its default branch HEAD: this support has no
# install.yml to fix a version. zebra.template with its zebraRegisterWrite* templates and
# ADBase.template; signals read a demand record and its readback where the template has both.

label: zebra
children:
- type: Group
  name: Status
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: Connected
    label: Connected
    read_pv: $(P)$(Q):CONNECTED
    read_widget:
      type: LED
  - type: SignalR
    name: InitialPollDone
    label: Initial Poll Done
    read_pv: $(P)$(Q):INITIAL_POLL_DONE
    read_widget:
      type: LED
  - type: SignalR
    name: SysVer
    label: Firmware Version
    read_pv: $(P)$(Q):SYS_VER
    read_widget:
      type: TextRead
  - type: Group
    name: RowSysStat1lo
    label: Bus Status 1 (Lo, Hi)
    layout:
      type: Row
    children:
    - type: SignalR
      name: SysStat1lo
      read_pv: $(P)$(Q):SYS_STAT1LO
      read_widget:
        type: TextRead
        format: hexadecimal
    - type: SignalR
      name: SysStat1hi
      read_pv: $(P)$(Q):SYS_STAT1HI
      read_widget:
        type: TextRead
        format: hexadecimal
  - type: Group
    name: RowSysStat2lo
    label: Bus Status 2 (Lo, Hi)
    layout:
      type: Row
    children:
    - type: SignalR
      name: SysStat2lo
      read_pv: $(P)$(Q):SYS_STAT2LO
      read_widget:
        type: TextRead
        format: hexadecimal
    - type: SignalR
      name: SysStat2hi
      read_pv: $(P)$(Q):SYS_STAT2HI
      read_widget:
        type: TextRead
        format: hexadecimal

- type: Group
  name: PositionCompare
  label: Position Compare
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalW
    name: PcArm
    label: Arm
    write_pv: $(P)$(Q):PC_ARM
    write_widget:
      type: ButtonPanel
      actions:
        Arm: '1'
  - type: SignalW
    name: PcDisarm
    label: Disarm
    write_pv: $(P)$(Q):PC_DISARM
    write_widget:
      type: ButtonPanel
      actions:
        Disarm: '1'
  - type: SignalR
    name: PcArmOut
    label: Arm Status
    read_pv: $(P)$(Q):PC_ARM_OUT
    read_widget:
      type: LED
  - type: SignalR
    name: ArmBusy
    label: Arm Busy
    read_pv: $(P)$(Q):ARM_BUSY
    read_widget:
      type: TextRead
  - type: SignalR
    name: ArrayAcq
    label: Download
    read_pv: $(P)$(Q):ARRAY_ACQ
    read_widget:
      type: LED
  - type: SignalR
    name: PcNumCap
    label: Points Captured
    read_pv: $(P)$(Q):PC_NUM_CAP
    read_widget:
      type: TextRead
  - type: SignalR
    name: PcNumDown
    label: Points Downloaded
    read_pv: $(P)$(Q):PC_NUM_DOWN
    read_widget:
      type: TextRead

- type: Group
  name: SoftInputs
  label: Soft Inputs
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalRW
    name: SoftInB0
    label: Soft In 1
    write_pv: $(P)$(Q):SOFT_IN:B0
    write_widget:
      type: CheckBox
  - type: SignalRW
    name: SoftInB1
    label: Soft In 2
    write_pv: $(P)$(Q):SOFT_IN:B1
    write_widget:
      type: CheckBox
  - type: SignalRW
    name: SoftInB2
    label: Soft In 3
    write_pv: $(P)$(Q):SOFT_IN:B2
    write_widget:
      type: CheckBox
  - type: SignalRW
    name: SoftInB3
    label: Soft In 4
    write_pv: $(P)$(Q):SOFT_IN:B3
    write_widget:
      type: CheckBox

- type: Group
  name: Errors
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: SysStaterr
    label: Error State
    read_pv: $(P)$(Q):SYS_STATERR
    read_widget:
      type: TextRead
      format: hexadecimal
  - type: SignalR
    name: SysStaterrB0
    label: PULSE1 Trig While Active
    read_pv: $(P)$(Q):SYS_STATERR.B0
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB1
    label: PULSE2 Trig While Active
    read_pv: $(P)$(Q):SYS_STATERR.B1
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB2
    label: PULSE3 Trig While Active
    read_pv: $(P)$(Q):SYS_STATERR.B2
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB3
    label: PULSE4 Trig While Active
    read_pv: $(P)$(Q):SYS_STATERR.B3
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB4
    label: PC Buffer Overflow
    read_pv: $(P)$(Q):SYS_STATERR.B4
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB5
    label: Err 5
    read_pv: $(P)$(Q):SYS_STATERR.B5
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB6
    label: Err 6
    read_pv: $(P)$(Q):SYS_STATERR.B6
    read_widget:
      type: LED
  - type: SignalR
    name: SysStaterrB7
    label: Err 7
    read_pv: $(P)$(Q):SYS_STATERR.B7
    read_widget:
      type: LED

- type: Group
  name: Setup
  layout:
    type: Grid
    labelled: true
  children:
  - type: Group
    name: ZebraPc
    label: Position Compare
    layout:
      type: SubScreen
      labelled: false
    children:
    - type: Group
      name: Arm
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: PcArmSel
        label: Trig Source
        write_pv: $(P)$(Q):PC_ARM_SEL
        write_widget:
          type: ComboBox
        read_pv: $(P)$(Q):PC_ARM_SEL:RBV
        read_widget:
          type: TextRead
      - type: Group
        name: RowPcArmInp
        label: Arm Input
        layout:
          type: Row
          header:
          - Source
          - Name
          - Status
        children:
        - type: SignalW
          name: PcArmInp
          write_pv: $(P)$(Q):PC_ARM_INP
          write_widget:
            type: TextWrite
        - type: SignalR
          name: PcArmInpStr
          read_pv: $(P)$(Q):PC_ARM_INP:STR
          read_widget:
            type: TextRead
            format: string
        - type: SignalR
          name: PcArmInpSta
          read_pv: $(P)$(Q):PC_ARM_INP:STA
          read_widget:
            type: LED
      - type: SignalW
        name: PcArmPc
        label: Arm
        write_pv: $(P)$(Q):PC_ARM
        write_widget:
          type: ButtonPanel
          actions:
            Arm: '1'
      - type: SignalW
        name: PcDisarmPc
        label: Disarm
        write_pv: $(P)$(Q):PC_DISARM
        write_widget:
          type: ButtonPanel
          actions:
            Disarm: '1'
      - type: SignalR
        name: PcArmOutPc
        label: Arm Status
        read_pv: $(P)$(Q):PC_ARM_OUT
        read_widget:
          type: LED
    - type: Group
      name: General2
      label: Setup
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: PcEnc
        label: Posn Trig
        write_pv: $(P)$(Q):PC_ENC
        write_widget:
          type: ComboBox
        read_pv: $(P)$(Q):PC_ENC:RBV
        read_widget:
          type: TextRead
      - type: SignalRW
