        write_pv: $(P)$(Q):PC_DIR
        write_widget:
          type: ComboBox
        read_pv: $(P)$(Q):PC_DIR:RBV
        read_widget:
          type: TextRead
      - type: SignalRW
        name: PcTspre2
        label: Time Units
        write_pv: $(P)$(Q):PC_TSPRE
        write_widget:
          type: ComboBox
        read_pv: $(P)$(Q):PC_TSPRE:RBV
        read_widget:
          type: TextRead
    - type: Group
      name: Capture
      layout:
        type: Grid
        labelled: true
      children:
      - type: SignalRW
        name: PcBitCapB0
        label: Enc1
        write_pv: $(P)$(Q):PC_BIT_CAP:B0
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB1
        label: Enc2
        write_pv: $(P)$(Q):PC_BIT_CAP:B1
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB2
        label: Enc3
        write_pv: $(P)$(Q):PC_BIT_CAP:B2
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB3
        label: Enc4
        write_pv: $(P)$(Q):PC_BIT_CAP:B3
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB4
        label: Sys1
        write_pv: $(P)$(Q):PC_BIT_CAP:B4
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB5
        label: Sys2
        write_pv: $(P)$(Q):PC_BIT_CAP:B5
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB6
        label: Div1
        write_pv: $(P)$(Q):PC_BIT_CAP:B6
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB7
        label: Div2
        write_pv: $(P)$(Q):PC_BIT_CAP:B7
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB8
        label: Div3
        write_pv: $(P)$(Q):PC_BIT_CAP:B8
        write_widget:
          type: CheckBox
      - type: SignalRW
        name: PcBitCapB9
