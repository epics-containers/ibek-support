      write_pv: $(P)$(Q):SETP.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
- type: Group
  name: ProtectedControls
  label: Protected Controls
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: ProtectedPosition
    label: Position
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalW
      name: MoveToSelectedPosition
      label: Move to Selected Position
      description: Sends the value of the selected position to the device, which moves it
      write_pv: $(P)$(Q):SEL.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Move: '1'
