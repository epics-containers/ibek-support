      write_pv: $(P)$(Q):SETL.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SetmProc
      label: Position 13
      write_pv: $(P)$(Q):SETM.PROC
      write_widget:
        type: ButtonPanel
