      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SeteProc
      label: Position 5
      write_pv: $(P)$(Q):SETE.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SetfProc
