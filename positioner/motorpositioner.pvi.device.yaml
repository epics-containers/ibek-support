      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SethProc
      label: Position 8
      write_pv: $(P)$(Q):SETH.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SetiProc
      label: Position 9
      write_pv: $(P)$(Q):SETI.PROC
      write_widget:
        type: ButtonPanel
        actions:
          Set: '1'
    - type: SignalW
      name: SetjProc
