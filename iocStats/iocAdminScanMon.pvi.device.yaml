# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# The scan period monitor of iocStats, from upstream iocAdminScanMon.substitutions.
# Tolerances are field PVs (the B and C fields), so this device has no PVI PV.

label: IOC Scan Monitor
children:
- type: Group
  name: ScanRates
  label: Scan Rates
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: ScanMonSeverity
    label: Worst Scan Severity
    read_pv: $(IOC):SCANMON_SEVR
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod10Hz
    label: 10 Hz Scan Period
    read_pv: $(IOC):10HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod5Hz
    label: 5 Hz Scan Period
    read_pv: $(IOC):5HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod2Hz
    label: 2 Hz Scan Period
    read_pv: $(IOC):2HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod1Hz
    label: 1 Hz Scan Period
    read_pv: $(IOC):1HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod05Hz
    label: 0.5 Hz Scan Period
    read_pv: $(IOC):05HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod02Hz
    label: 0.2 Hz Scan Period
    read_pv: $(IOC):02HZ_UPD_TIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: ScanPeriod01Hz
    label: 0.1 Hz Scan Period
    read_pv: $(IOC):01HZ_UPD_TIME
    read_widget:
      type: TextRead

- type: Group
  name: ProtectedControls
  label: Protected Controls
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: ScanTolerances
    label: Scan Mode and Tolerances
    layout:
      type: Grid
      labelled: true
    children:
    - type: Group
      name: ScanTolerance10Hz
      label: 10 Hz Scan
      layout:
        type: Row
        header:
        - Mode
        - Minor Tolerance (%)
        - Major Tolerance (%)
      children:
      - type: SignalRW
        name: ScanMode10Hz
        write_pv: $(IOC):10HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance10Hz
        write_pv: $(IOC):10HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance10Hz
        write_pv: $(IOC):10HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance5Hz
      label: 5 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode5Hz
        write_pv: $(IOC):5HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance5Hz
        write_pv: $(IOC):5HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance5Hz
        write_pv: $(IOC):5HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance2Hz
      label: 2 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode2Hz
        write_pv: $(IOC):2HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance2Hz
        write_pv: $(IOC):2HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance2Hz
        write_pv: $(IOC):2HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance1Hz
      label: 1 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode1Hz
        write_pv: $(IOC):1HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance1Hz
        write_pv: $(IOC):1HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance1Hz
        write_pv: $(IOC):1HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance05Hz
      label: 0.5 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode05Hz
        write_pv: $(IOC):05HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance05Hz
        write_pv: $(IOC):05HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance05Hz
        write_pv: $(IOC):05HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance02Hz
      label: 0.2 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode02Hz
        write_pv: $(IOC):02HZ_MODE
        write_widget:
          type: ComboBox
      - type: SignalW
        name: MinorTolerance02Hz
        write_pv: $(IOC):02HZ_UPD_TIME.B
        write_widget:
          type: TextWrite
      - type: SignalW
        name: MajorTolerance02Hz
        write_pv: $(IOC):02HZ_UPD_TIME.C
        write_widget:
          type: TextWrite
    - type: Group
      name: ScanTolerance01Hz
      label: 0.1 Hz Scan
      layout:
        type: Row
      children:
      - type: SignalRW
        name: ScanMode01Hz
        write_pv: $(IOC):01HZ_MODE
