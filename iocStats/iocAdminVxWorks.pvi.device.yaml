# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# Everything on the iocAdminSoft screen plus the records that only upstream
# iocAdminVxWorks.substitutions adds: iocRTOS, iocVxWorksOnly and iocCluster.

label: IOC Stats VxWorks
children:
- type: Include
  file_name: iocAdminSoft

- type: Group
  name: VxWorksBoot
  label: Boot
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: BootLine
    read_pv: $(IOC):BOOTLINE
    read_widget:
      type: TextRead
      format: string
  - type: SignalR
    name: BspRevision
    label: BSP Revision
    read_pv: $(IOC):BSP_REV
    read_widget:
      type: TextRead

- type: Group
  name: VxWorksMemory
  label: Memory Blocks
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: MemoryBlockMax
    label: Largest Free Block
    read_pv: $(IOC):MEM_BLK
    read_widget:
      type: TextRead
  - type: SignalR
    name: MemoryBlockFree
    label: Largest Free Block (calc)
    read_pv: $(IOC):MEM_BLK_FREE
    read_widget:
      type: TextRead

- type: Group
  name: VxWorksNetwork
  label: Network
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: SystemMbufFree
    label: System MBUFs Min Free (%)
    read_pv: $(IOC):SYS_MBUF_FREE
    read_widget:
      type: TextRead
  - type: SignalR
    name: SystemMbufMax
    label: System MBUFs
    read_pv: $(IOC):SYS_MBUF_MAX
    read_widget:
      type: TextRead
  - type: SignalR
    name: DataMbufFree
    label: Data MBUFs Min Free (%)
    read_pv: $(IOC):DAT_MBUF_FREE
    read_widget:
      type: TextRead
  - type: SignalR
    name: DataMbufMax
    label: Data MBUFs
    read_pv: $(IOC):DAT_MBUF_MAX
    read_widget:
      type: TextRead
  - type: SignalR
    name: InterfaceInputErrors
    read_pv: $(IOC):IFI_ERR_CNT
    read_widget:
      type: TextRead
  - type: SignalR
    name: InterfaceOutputErrors
    read_pv: $(IOC):IFO_ERR_CNT
    read_widget:
      type: TextRead

