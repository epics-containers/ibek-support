# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: devIocStats

entity_models:
  - name: iocAdminVxWorks
    description: |-
      Create some records for reading IOC statistics and details.
    parameters:
      IOC:
        type: str
        description: |-
          Device prefix

    databases:
      - file: $(IOCSTATS)/db/iocAdminVxWorks.db
        args:
          IOC:

    pvi:
      yaml_path: iocAdminVxWorks.pvi.device.yaml
      ui_macros:
        IOC:
      # no pv: true: a record absent at the RTEMS commit stops the rest of ioc.db loading
      pv_prefix: "$(IOC):"

  - name: iocAdminScanMon
    description: |-
      Create some records for reading IOC statistics and details.
    parameters:
      IOC:
        type: str
        description: |-
          Device prefix

    databases:
      - file: $(IOCSTATS)/db/iocAdminScanMon.db
        args:
          IOC:

    pvi:
      yaml_path: iocAdminScanMon.pvi.device.yaml
      ui_macros:
        IOC:
      pv_prefix: "$(IOC):"

  - name: iocAdminSoft
    description: |-
      Create some records for reading IOC statistics and details.
    parameters:
      IOC:
        type: str
        description: |-
          Device prefix

    databases:
      - file: $(IOCSTATS)/db/iocAdminSoft.db
        args:
          IOC:

      # iocAdminSoft.db holds the ScanMon records in iocStats 4.0.1, the Linux
      # build. RTEMS builds iocStats at 4226b12, whose iocAdminSoft.db does not.
      - file: $(IOCSTATS)/db/iocAdminScanMon.db
        enabled: "{{ 'RTEMS' in _global.get_env('EPICS_TARGET_ARCH') }}"
        args:
          IOC:

    pvi:
      yaml_path: iocAdminSoft.pvi.device.yaml
      ui_macros:
        IOC:
      # no pv: true: a record absent at the RTEMS commit stops the rest of ioc.db loading
      pv_prefix: "$(IOC):"
