- type: Group
  name: ProtectedControls
  label: Protected Controls
  layout:
    type: SubScreen
    labelled: false
  children:
  - type: Group
    name: IocControl
    label: IOC Control
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalX
      name: RestartIoc
      label: Restart IOC
      write_pv: $(IOC):SYSRESET
      value: "1"
      write_widget:
        type: ButtonPanel
        actions:
          Restart: "1"
    - type: SignalX
      name: ReloadAccessSecurity
      label: Reload Access Security File
      write_pv: $(IOC):READACF
      value: "1"
      write_widget:
        type: ButtonPanel
        actions:
          Reload: "1"
    - type: SignalRW
      name: AccessMode
      write_pv: $(IOC):ACCESS
      write_widget:
        type: ComboBox
    - type: SignalX
      name: TimeErrorReset
      label: Reset Time Errors
      write_pv: $(IOC):GTIM_RESET
      value: "1"
      write_widget:
        type: ButtonPanel
        actions:
          Reset: "1"
  - type: Group
    name: UpdatePeriods
    label: Update Periods (s)
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: CaUpdatePeriod
      label: CA
      write_pv: $(IOC):CA_UPD_TIME
      write_widget:
        type: TextWrite
    - type: SignalRW
      name: FdUpdatePeriod
      label: File Descriptors
      write_pv: $(IOC):FD_UPD_TIME
      write_widget:
        type: TextWrite
    - type: SignalRW
      name: LoadUpdatePeriod
      label: CPU Load
      write_pv: $(IOC):LOAD_UPD_TIME
      write_widget:
        type: TextWrite
    - type: SignalRW
      name: MemoryUpdatePeriod
      label: Memory
      write_pv: $(IOC):MEM_UPD_TIME
      write_widget:
        type: TextWrite
  - type: Group
    name: ScanModes
    label: Scan Modes
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: ScanMode10Hz
      label: 10 Hz Scan Mode
      write_pv: $(IOC):10HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode5Hz
      label: 5 Hz Scan Mode
      write_pv: $(IOC):5HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode2Hz
      label: 2 Hz Scan Mode
      write_pv: $(IOC):2HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode1Hz
      label: 1 Hz Scan Mode
      write_pv: $(IOC):1HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode05Hz
      label: 0.5 Hz Scan Mode
      write_pv: $(IOC):05HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode02Hz
      label: 0.2 Hz Scan Mode
      write_pv: $(IOC):02HZ_MODE
      write_widget:
        type: ComboBox
    - type: SignalRW
      name: ScanMode01Hz
      label: 0.1 Hz Scan Mode
      write_pv: $(IOC):01HZ_MODE
      write_widget:
        type: ComboBox
