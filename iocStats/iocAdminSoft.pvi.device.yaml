# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# IOC statistics from upstream iocStats iocAdminSoft.substitutions, built against the
# CONFIG_ENV and CONFIG_SITE_ENV of EPICS base. PVs are the records themselves, never the
# deprecated aliases of siteEnvVarAliases.template. No field PVs, which leaves `pv: true`
# open wherever every record exists: RTEMS builds lack the environment records named here.

label: IOC Stats
children:
- type: Group
  name: IocInfo
  label: IOC Info
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: StartTime
    read_pv: $(IOC):STARTTOD
    read_widget:
      type: TextRead
  - type: SignalR
    name: CurrentTime
    read_pv: $(IOC):TOD
    read_widget:
      type: TextRead
  - type: SignalR
    name: UpTime
    read_pv: $(IOC):UPTIME
    read_widget:
      type: TextRead
  - type: SignalR
    name: Heartbeat
    read_pv: $(IOC):HEARTBEAT
    read_widget:
      type: TextRead
  - type: SignalR
    name: StartCount
    read_pv: $(IOC):START_CNT
    read_widget:
      type: TextRead
  - type: SignalR
    name: HostName
    read_pv: $(IOC):HOSTNAME
    read_widget:
      type: TextRead
  - type: SignalR
    name: Engineer
