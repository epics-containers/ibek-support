# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: ADUVC

entity_models:
  - name: UVC
    description: |-
      Controls a USB Video Class device.
      Automatically creates an NDStdArrays plugin for array output.
    parameters:
      P:
        type: str
        description: Device Prefix

      R:
        type: str
        description: Device Suffix

      PORT:
        type: id
        description: Port name for the detector

      serial:
        type: str
        description: Serial number, leave blank if using productID
        default: ""

      productID:
        type: str
        description: Product ID, leave blank if using serial number
        default: ""

      TIMEOUT:
        type: int
        description: Timeout
        default: 1

      ADDR:
        type: int
        description: Asyn Port address
        default: 0

      ATTRIBUTES_FILE:
        type: str
        description: |-
          NDAttributes XML that lists the attributes to attach to each NDArray.
          Leave empty to set nothing at startup.
          Usually a file name: put the file in the IOC instance's config folder
          and give its name, which resolves to /epics/ioc/config/<name>. A path
          starting with / is used as given.
          A value containing <Attributes> is passed inline as the XML itself.
          Inline XML must fit in 255 characters, the size of the NDAttributesFile waveform.
          Setting this overrides the autosaved NDAttributesFile at each IOC start.
        default: ""

      ATTRIBUTES_MACROS:
        type: str
        description: |-
          Macro substitutions applied to the NDAttributes XML, e.g. "P=BL01T-EA-DET-01:,R=CAM:".
          Leave empty to set nothing at startup. Limited to 255 characters.
          Setting this overrides the autosaved NDAttributesMacros at each IOC start.
        default: ""

    pre_init:
      - value: |
          # ADUVCConfig(portName, serialOrProductID)
          ADUVCConfig("{{PORT}}", "{% if serial %}{{serial}}{% else %}{{productID}}{% endif %}")

          # NDStdArraysConfigure(portName, queueSize, blockingCallbacks, NDArrayPort, NDArrayAddr, maxBuffers, maxMemory, priority, stackSize, maxThreads)
          NDStdArraysConfigure("{{PORT}}.ARR", 2, 0, "{{PORT}}", 0, 0, 0, 0, 0, 1)

    post_init:
      # NDAttributes settings, after iocInit so they win over autosave.
      # Each " in a value becomes "'"'" because iocsh ignores backslashes in quotes.
      - value: |
          {%- set dq = '"' ~ "'" ~ '"' ~ "'" ~ '"' %}
          {%- if ATTRIBUTES_MACROS %}
          dbpf "{{ P }}{{ R }}NDAttributesMacros", "{{ ATTRIBUTES_MACROS | replace('"', dq) }}"
          {%- endif %}
          {%- if ATTRIBUTES_FILE %}
          {%- if '<Attributes>' in ATTRIBUTES_FILE %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "{{ ATTRIBUTES_FILE | replace('\n', ' ') | replace('"', dq) }}"
          {%- elif ATTRIBUTES_FILE.startswith('/') %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "{{ ATTRIBUTES_FILE }}"
          {%- else %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "/epics/ioc/config/{{ ATTRIBUTES_FILE }}"
          {%- endif %}
          {%- endif %}

    databases:
      - file: $(ADCORE)/db/ADBase.template
        args:
          P:
          R:
          PORT:
          TIMEOUT:
          ADDR:

      - file: $(ADUVC)/db/ADUVC.template
        args:
          P:
          R:
          PORT:
          TIMEOUT:
          ADDR:
          
      - file: $(ADCORE)/db/NDStdArrays.template
        args:
          P:
          R: ":ARR:"
          PORT: "{{PORT}}.ARR"
          NDARRAY_PORT: "{{PORT}}"
          TYPE: Int16
          FTVL: SHORT
          NELEMENTS: "6000000"
          TIMEOUT: "{{TIMEOUT}}"
          ADDR: "{{ADDR}}"

    pvi:
      yaml_path: ADUVC.pvi.device.yaml
      ui_macros:
        P:
        R:
      pv: true
      pv_prefix: $(P)$(R)
