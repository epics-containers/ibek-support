# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: ADAndor

entity_models:

  - name: andorCCD
    description: |-
      Creates an areaDetector driver for an Andor CCD camera
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      R:
        type: str
        description: |-
          Device Suffix
      PORT:
        type: id
        description: |-
          Port name for the detector
      TIMEOUT:
        type: int
        description: |-
          Timeout
        default: 5
      ADDR:
        type: int
        description: |-
          Asyn Port address
        default: 0
      SCANRATE:
        type: enum
        description: |-
          Specified scan rate for cpu intensive PVs
        default: I/O Intr
        values:
          .1 second:
          .2 second:
          .5 second:
          1 second:
          2 second:
          5 second:
          10 second:
          I/O Intr:
          Event:
          Passive:
      SHAMROCKID:
        type: int
        description: |-
          shamrockID The index number of the Shamrock spectrograph, if installed.
        default: 0
      BUFFERS:
        type: int
        description: |-
          Maximum number of NDArray buffers to be created for plugin callbacks
        default: 50
      MEMORY:
        type: int
        description: |-
          Max memory to allocate, should be maxw*maxh*nbuffer for driver and all attached plugins
        default: 0
      INSTALLPATH:
        type: str
        description: |-
          Path to configuration and firmware files required by Andor cameras
        default: /usr/local/andor2/etc
      PRIORITY:
        type: int
        description: |-
          The thread priority for the asyn port driver thread
        default: 0
      STACKSIZE:
        type: int
        description: |-
          The stack size for the asyn port driver thread
        default: 100000

      ATTRIBUTES_FILE:
        type: str
        description: |-
          NDAttributes XML that lists the attributes to attach to each NDArray.
          Leave empty to set nothing at startup.
          Usually a file name: put the file in the IOC instance's config folder
          and give its name, which resolves to /epics/ioc/config/<name>. A path
          starting with / is used as given.
          A value containing <Attributes> is passed inline as the XML itself.
          Inline XML must fit in 255 characters, the size of the NDAttributesFile waveform.
          Setting this overrides the autosaved NDAttributesFile at each IOC start.
        default: ""

      ATTRIBUTES_MACROS:
        type: str
        description: |-
          Macro substitutions applied to the NDAttributes XML, e.g. "P=BL01T-EA-DET-01:,R=CAM:".
          Leave empty to set nothing at startup. Limited to 255 characters.
          Setting this overrides the autosaved NDAttributesMacros at each IOC start.
        default: ""

    post_init:
      # NDAttributes settings, after iocInit so they win over autosave.
      # Each " in a value becomes "'"'" because iocsh ignores backslashes in quotes.
      - value: |
          {%- set dq = '"' ~ "'" ~ '"' ~ "'" ~ '"' %}
          {%- if ATTRIBUTES_MACROS %}
          dbpf "{{ P }}{{ R }}NDAttributesMacros", "{{ ATTRIBUTES_MACROS | replace('"', dq) }}"
          {%- endif %}
          {%- if ATTRIBUTES_FILE %}
          {%- if '<Attributes>' in ATTRIBUTES_FILE %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "{{ ATTRIBUTES_FILE | replace('\n', ' ') | replace('"', dq) }}"
          {%- elif ATTRIBUTES_FILE.startswith('/') %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "{{ ATTRIBUTES_FILE }}"
          {%- else %}
          dbpf "{{ P }}{{ R }}NDAttributesFile", "/epics/ioc/config/{{ ATTRIBUTES_FILE }}"
          {%- endif %}
          {%- endif %}

    databases:

      - file: $(ADANDOR)/db/andorCCD.template
        args:
          P:
          R:
          PORT:
          TIMEOUT:
          ADDR:
          SCANRATE:

    pvi:
      yaml_path: ADAndor.pvi.device.yaml
      pv: true
      pv_prefix: $(P)$(R)
      ui_macros:
        P:
        R:

    pre_init:
      - value: |
          # andorCCDConfig(portName, installPath, shamrockID, maxBuffers, maxMemory, priority, stackSize)
          andorCCDConfig("{{PORT}}", "{{INSTALLPATH}}", {{SHAMROCKID}}, {{BUFFERS}}, {{MEMORY}}, {{PRIORITY}}, {{STACKSIZE}})
