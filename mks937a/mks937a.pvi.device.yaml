# yaml-language-server: $schema=https://github.com/epics-containers/pvi/releases/latest/download/pvi.device.schema.json

# The MKS 937A gauge controller, from mks937a.template at mks937a 3-0.

label: mks937a
children:
- type: Group
  name: Details
  layout:
    type: Grid
    labelled: true
  children:
  - type: SignalR
    name: F
    label: Line Frequency
    read_pv: $(device):F
    read_widget:
      type: TextRead
  - type: SignalR
    name: Unit
    label: Pressure Unit
    read_pv: $(device):UNIT
    read_widget:
      type: TextRead
      format: string
  - type: SignalR
    name: Ctlv
    label: Controller Version
    read_pv: $(device):CTLV
    read_widget:
      type: TextRead
  - type: SignalR
    name: Comv
    label: Comms Version
    read_pv: $(device):COMV
    read_widget:
      type: TextRead
  - type: SignalR
    name: Mcc
    label: Slot CC
    read_pv: $(device):MCC
    read_widget:
      type: TextRead
  - type: SignalR
    name: Ma
    label: Slot A
    read_pv: $(device):MA
    read_widget:
      type: TextRead
  - type: SignalR
    name: Mb
    label: Slot B
    read_pv: $(device):MB
    read_widget:
      type: TextRead
  - type: SignalR
    name: Comms
    label: Comms
    read_pv: $(device):COMMS
    read_widget:
      type: TextRead
  - type: SignalR
    name: Error
    label: Last Error
    read_pv: $(device):ERROR
    read_widget:
      type: TextRead
      format: string
