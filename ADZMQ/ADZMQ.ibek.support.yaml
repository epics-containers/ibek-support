# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: ADZMQ

entity_models:
  - name: ZMQDriver
    description: |-
      TODO:ADD DESCRIPTION
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      R:
        type: str
        description: |-
          Device Suffix
      PORT:
        type: id
        description: |-
          Port name for the NDProcess plugin
      SOURCE_ADDR:
        type: str
        description: |-
          Address of ZMQ data sender
      TIMEOUT:
        type: int
        description: |-
          Asyn parm timeout
        default: 1
      ADDR:
        type: int
        description: |-
          Asyn param address
        default: 0
      SCANRATE:
        type: enum
        description: |-
          Specified scan rate for cpu intensive PVs
        default: I/O Intr
        values:
          .1 second:
          .2 second:
          .5 second:
          1 second:
          2 second:
          5 second:
          10 second:
          I/O Intr:
          Event:
          Passive:

      ATTRIBUTES_FILE:
        type: str
        description: |-
          NDAttributes XML to attach to each NDArray. Preferred: the XML itself,
          inline. Alternative: a file name in the IOC instance's config folder,
          or an absolute path. XMLSIZE grows to fit either. Empty sets nothing.
          See ADCore.NDAttributesConfig.
        default: ""

      ATTRIBUTES_MACROS:
        type: str
        description: |-
          Macro substitutions for the NDAttributes XML, e.g. "P=BL01T-EA-DET-01:,R=CAM:".
          At most 255 bytes. Empty sets nothing. See ADCore.NDAttributesConfig.
        default: ""

      XMLSIZE:
        type: int
        description: |-
          Number of bytes in the NDAttributesFile waveform record. Grown
          automatically to fit ATTRIBUTES_FILE (the inline XML or the resolved
          path, in UTF-8, plus a NUL); a larger value given here wins.
        default: 256

    sub_entities:
      - type: ADCore.NDAttributesConfig
        P: "{{ P }}"
        R: "{{ R }}"
        ATTRIBUTES_FILE: "{{ ATTRIBUTES_FILE }}"
        ATTRIBUTES_MACROS: "{{ ATTRIBUTES_MACROS }}"

    databases:
      #   - file: $(ADZMQ)/db/ZMQDriver.template
      #     args:
      #       P:
      #       R:
      #       PORT:
      #       ADDR:
      #       TIMEOUT:

      - file: $(ADCORE)/db/ADBase.template
        args:
          XMLSIZE: "{{ [XMLSIZE, ((ATTRIBUTES_FILE.split() | join(' ')) if '<Attributes>' in ATTRIBUTES_FILE else (ATTRIBUTES_FILE | trim) if (ATTRIBUTES_FILE | trim).startswith('/') or not (ATTRIBUTES_FILE | trim) else '/epics/ioc/config/' ~ (ATTRIBUTES_FILE | trim)).encode('utf-8') | length + 1] | max }}"
          P:
          R:
          PORT:
          TIMEOUT:
          ADDR:
          SCANRATE:

    pre_init:
      - value: |
          # ZMQDriverConfig(portName, serverHost, maxBuffers, maxMemory, priority, stackSize)
          ZMQDriverConfig("{{PORT}}", "{{SOURCE_ADDR}}", 0, 0, 0, 0)

    pvi:
      yaml_path: ZMQDriver.pvi.device.yaml
      ui_macros:
        P:
        R:
      pv_prefix: "$(P)$(R)"

