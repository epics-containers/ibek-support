# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: eurothermModbus

entity_models:
  - name: Eurotherm2K
    description: |-
      Eurotherm 2000-series temperature controller with Modbus RTU
      communication over TCP. Creates an AsynIP port, configures Modbus
      interpose and RX/TX Modbus ports, then loads the disable, loop,
      and archive templates for a single control loop (LOOP1).
    parameters:
      device:
        type: str
        description: |-
          Device prefix used in PVs, e.g. BL01T-EA-TEMP-01
      port:
        type: str
        description: |-
          Asyn IP port name
      ipaddress:
        type: str
        description: |-
          Eurotherm IP address
      tcpport:
        type: int
        description: |-
          TCP port number
        default: 502
      noAutoConnect:
        type: bool
        description: |-
          Set to true to disable auto-connect on the asyn port
        default: false
      rregu:
        type: enum
        description: |-
          Ramp rate engineering units
        values:
          C/s:
          C/min:
        default: C/s
      modbus_prefix:
        type: str
        description: |-
          Modbus port name prefix. Used to construct the RX and TX
          modbus port names (e.g. EURTHM_MB_1). Generated by converter.

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{port}}", "{{ipaddress}}:{{tcpport}}", 100, {{1 if noAutoConnect else 0}}, 1)
          modbusInterposeConfig("{{port}}",1, 2000, 0)
          # params are portname, tcpportname, slaveaddr, modbusfunction (3)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_RX","{{port}}",1, 3,-1,1, 0,1000, "")
          # params are portname, tcpportname, slaveaddr, modbusfunction (6)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_TX","{{port}}",1, 6,-1,1, 0,0, "")
          asynSetOption("{{port}}", 0, "disconnectOnReadTimeout", "Y")

    databases:
      - file: $(EUROTHERMMODBUS)/db/eurothermDis.template
        args:
          device:

      - file: $(EUROTHERMMODBUS)/db/eurothermLoop.template
        args:
          device:
          modbus_prefix:
          loop_name: LOOP1
          rregu: "{% if rregu == 'C/min' %}1{% else %}0{% endif %}"
          autotune_addr: "270"
          derivative_addr: "9"
          integral_addr: "8"
          mode_addr: "273"
          output_addr: "3"
          outputhi_addr: "30"
          outputlo_addr: "31"
          proportional_addr: "6"
          temperature_addr: "1"
          ramprate_addr: "35"
          setpoint_addr: "2"
          working_setpoint_addr: "5"
          # LOOP1 setpoint limit registers, as the module's builder.py passes
          # them; eurothermLoop.template has no defaults for these.
          setpoint_limitHI_addr: "111"
          setpoint_limitLO_addr: "112"

      - file: $(EUROTHERMMODBUS)/db/eurotherm2k-archive.template
        args:
          device:

    pvi:
      yaml_path: eurothermDis.pvi.device.yaml
      ui_macros:
        device:
        loop_name: "LOOP1"
      pv_prefix: "$(device):"
