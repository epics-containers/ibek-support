# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: eurothermModbus

entity_models:
  - name: Eurotherm2K
    description: |-
      Eurotherm 2000-series temperature controller with Modbus RTU
      communication over TCP. Creates an AsynIP port, configures Modbus
      interpose and RX/TX Modbus ports, then loads the disable, loop,
      and archive templates for a single control loop (LOOP1).
    parameters: &eurotherm_parameters
      device:
        type: str
        description: |-
          Device prefix used in PVs, e.g. BL01T-EA-TEMP-01
      port:
        type: str
        description: |-
          Asyn IP port name
      ipaddress:
        type: str
        description: |-
          Eurotherm IP address
      tcpport:
        type: int
        description: |-
          TCP port number
        default: 502
      noAutoConnect:
        type: bool
        description: |-
          Set to true to disable auto-connect on the asyn port
        default: false
      rregu:
        type: enum
        description: |-
          Ramp rate engineering units
        values:
          C/s:
          C/min:
        default: C/s
      modbus_prefix:
        type: str
        description: |-
          Modbus port name prefix. Used to construct the RX and TX
          modbus port names (e.g. EURTHM_MB_1). Generated by converter.

    pre_init: &eurotherm_rtu_pre_init
      - value: |
          drvAsynIPPortConfigure("{{port}}", "{{ipaddress}}:{{tcpport}}", 100, {{1 if noAutoConnect else 0}}, 1)
          modbusInterposeConfig("{{port}}",1, 2000, 0)
          # params are portname, tcpportname, slaveaddr, modbusfunction (3)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_RX","{{port}}",1, 3,-1,1, 0,1000, "")
          # params are portname, tcpportname, slaveaddr, modbusfunction (6)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_TX","{{port}}",1, 6,-1,1, 0,0, "")
          asynSetOption("{{port}}", 0, "disconnectOnReadTimeout", "Y")

    databases:
      - &eurotherm_disable
        file: $(EUROTHERMMODBUS)/db/eurothermDis.template
        args:
          device:

      - &eurotherm_loop1
        file: $(EUROTHERMMODBUS)/db/eurothermLoop.template
        args:
          device:
          modbus_prefix:
          loop_name: LOOP1
          rregu: "{% if rregu == 'C/min' %}1{% else %}0{% endif %}"
          autotune_addr: "270"
          derivative_addr: "9"
          integral_addr: "8"
          mode_addr: "273"
          output_addr: "3"
          outputhi_addr: "30"
          outputlo_addr: "31"
          proportional_addr: "6"
          temperature_addr: "1"
          ramprate_addr: "35"
          setpoint_addr: "2"
          working_setpoint_addr: "5"
          # LOOP1 setpoint limit registers, as the module's builder.py passes
          # them; eurothermLoop.template has no defaults for these.
          setpoint_limitHI_addr: "111"
          setpoint_limitLO_addr: "112"

      - file: $(EUROTHERMMODBUS)/db/eurotherm2k-archive.template
        args:
          device:

    pvi:
      yaml_path: eurothermDis.pvi.device.yaml
      ui_macros:
        device:
        loop_name: "LOOP1"
      pv_prefix: "$(device):"

  - name: Eurotherm3K
    description: |-
      Eurotherm 3000-series temperature controller with Modbus TCP over
      ethernet. Creates an AsynIP port, configures Modbus interpose and
      RX/TX Modbus ports, then loads the disable, loop (LOOP1 and LOOP2),
      programmer, recorder and archive templates.
    parameters: *eurotherm_parameters

    pre_init: &eurotherm_tcpip_pre_init
      - value: |
          drvAsynIPPortConfigure("{{port}}", "{{ipaddress}}:{{tcpport}}", 100, {{1 if noAutoConnect else 0}}, 1)
          modbusInterposeConfig("{{port}}",0, 2000, 0)
          # params are portname, tcpportname, slaveaddr, modbusfunction (3)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_RX","{{port}}",1, 3,-1,1, 0,1000, "")
          # params are portname, tcpportname, slaveaddr, modbusfunction (6)
          #      modbusstartaddr, modbuslen, datatype (0)
          #      pollmsec, plctype
          drvModbusAsynConfigure("{{modbus_prefix}}_MASTER_TX","{{port}}",1, 6,-1,1, 0,0, "")
          asynSetOption("{{port}}", 0, "disconnectOnReadTimeout", "Y")

    databases: &eurotherm_3k_databases
      - *eurotherm_disable
      - *eurotherm_loop1

      - file: $(EUROTHERMMODBUS)/db/eurothermLoop.template
        args:
          device:
          modbus_prefix:
          loop_name: LOOP2
          rregu: "{% if rregu == 'C/min' %}1{% else %}0{% endif %}"
          autotune_addr: "1294"
          derivative_addr: "1033"
          integral_addr: "1032"
          mode_addr: "1297"
          output_addr: "1027"
          outputhi_addr: "1054"
          outputlo_addr: "1055"
          proportional_addr: "1030"
          temperature_addr: "1025"
          ramprate_addr: "1059"
          setpoint_addr: "1026"
          working_setpoint_addr: "1029"
          setpoint_limitHI_addr: "113"
          setpoint_limitLO_addr: "114"

      - file: $(EUROTHERMMODBUS)/db/eurothermProg.template
        args:
          device:
          modbus_prefix:

      - file: $(EUROTHERMMODBUS)/db/eurothermRec.template
        args:
          device:
          modbus_prefix:

      - file: $(EUROTHERMMODBUS)/db/eurotherm3k-archive.template
        args:
          device:

  - name: Eurotherm3KPIDselect
    description: |-
      Eurotherm 3000-series temperature controller with Modbus TCP over
      ethernet, as Eurotherm3K, for use with PID parameter set selection.
      Add an EurothermLoopPIDselect for each of LOOP1 and LOOP2.
    parameters: *eurotherm_parameters

    pre_init: *eurotherm_tcpip_pre_init

    databases: *eurotherm_3k_databases

  - name: Eurotherm3Krtu
    description: |-
      Eurotherm 3000-series temperature controller with Modbus RTU over a
      serial line (through a terminal server). Creates an AsynIP port,
      configures Modbus interpose and RX/TX Modbus ports, then loads the
      disable, loop (LOOP1 and LOOP2), programmer, recorder and archive
      templates.
    parameters: *eurotherm_parameters

    pre_init: *eurotherm_rtu_pre_init

    databases: *eurotherm_3k_databases

  - name: Eurotherm3KrtuPIDselect
    description: |-
      Eurotherm 3000-series temperature controller with Modbus RTU over a
      serial line, as Eurotherm3Krtu, for use with PID parameter set
      selection. Add an EurothermLoopPIDselect for each of LOOP1 and LOOP2.
    parameters: *eurotherm_parameters

    pre_init: *eurotherm_rtu_pre_init

    databases: *eurotherm_3k_databases

  - name: EurothermLoopPIDselect
    description: |-
      PID parameter set selection for one loop of an Eurotherm3KPIDselect or
      Eurotherm3KrtuPIDselect: up to eight named P, I, D and output limit
      sets.
    parameters:
      device:
        type: str
        description: |-
          Device prefix used in PVs, the device of the controller
      loop_name:
        type: str
        description: |-
          Loop name used in PVs, LOOP1 or LOOP2
      STRA:
        type: str
        description: |-
          Name for PID selection 1
        default: "PID 1"
      STRB:
        type: str
        description: |-
          Name for PID selection 2
        default: "PID 2"
      STRC:
        type: str
        description: |-
          Name for PID selection 3
        default: "PID 3"
      STRD:
        type: str
        description: |-
          Name for PID selection 4
        default: "PID 4"
      STRE:
        type: str
        description: |-
          Name for PID selection 5
        default: "PID 5"
      STRF:
        type: str
        description: |-
          Name for PID selection 6
        default: "PID 6"
      STRG:
        type: str
        description: |-
          Name for PID selection 7
