# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: OXCryo

entity_models:
  - name: OXCS1000
    description: |-
      Control for Oxford cryostream 700 series
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      Q:
        type: str
        description: |-
          Device suffix
        default: ""
      PORT:
        type: str
        description: |-
          Asyn port to connect to
      name:
        type: id
        description: |-
          Object and gui association name
      CTEMP_MIN:
        type: int
        description: |-
          macro to set minimum target temperature
        default: 80
      CTEMP_MAX:
        type: float
        description: |-
          macro to set maximum target temperature
        default: 327.67
      DISABLE_COMMS:
        type: int
        description: |-
          Optional macro to control whether comms are disabled (1) or not (0) on startup. Defaults to disabled
        default: 1

    databases:
      - file: $(OXCRYO)/db/OXCS1000.template
        args:
          .*:

