# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: oxCryo
version: 2026.9.1
organization: https://github.com/diamondlightsource

dbds:
  - oxCryoSupport.dbd
libs:
  - oxCryo

protocol_files:
  - oxCryoApp/protocol/OXCB700.proto
  - oxCryoApp/protocol/OXCB800.proto
  - oxCryoApp/protocol/OXCS700.proto
  - oxCryoApp/protocol/OXNH700.proto
  - oxCryoApp/protocol/OXcommon.proto

# upstream CONFIG_SITE hard codes BUILD_ARCHS = linux-x86_64
patch_lines:
  - path: configure/CONFIG_SITE
    regexp: ^BUILD_ARCHS\s*=
    line: BUILD_ARCHS = {{ host_arch }}
