# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: StreamDevice
# master @ 2026-08-10, 19 commits past 2.8.26. A SHA rather than a tag because
# 2.8.26 can't build on EPICS base 7.0.11 and upstream has cut no release since:
# its src/Makefile indents the stream*.dbd.d recipes with spaces, so they fall
# through to base's dbdExpand rule, which fails with no input. Base 7.0.11 (PR
# 766) leaves no .d file when that rule fails, so the build stops. Fixed by
# f473f4d.
# Replace with a tag as soon as one is cut.
version: 562dd5ad36e07989a8bbb231dcb5bd165537c7f6
dbds:
  - stream-base.dbd
  - stream.dbd
libs:
  - stream

organization: https://github.com/paulscherrerinstitute

# PCRE (v1) is built from source by pcre-build.yml: libpcre3 no longer exists
# in Ubuntu resolute (26.04) and StreamDevice does not support PCRE2.

remove_macros:
  - CALC

patch_lines:
  - path: "{{ config_linux_host }}"
    regexp: PCRE_LIB
    line: PCRE_LIB=/epics/support/PCRE/lib
  - path: "{{ config_linux_host }}"
    regexp: PCRE_INCLUDE
    line: PCRE_INCLUDE=/epics/support/PCRE/include

comment_out:
  - path: Makefile
    regexp: streamApp
  - path: Makefile
    regexp: pdf

tasks:
  - path: pcre-build.yml
