# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: StreamDevice
version: 2.8.26
dbds:
  - stream-base.dbd
  - stream.dbd
libs:
  - stream

organization: https://github.com/paulscherrerinstitute

# PCRE (v1) is built from source by pcre-build.yml: libpcre3 no longer exists
# in Ubuntu resolute (26.04) and StreamDevice does not support PCRE2.

remove_macros:
  - CALC

patch_lines:
  - path: "{{ config_linux_host }}"
    regexp: PCRE_LIB
    line: PCRE_LIB=/epics/support/PCRE/lib
  - path: "{{ config_linux_host }}"
    regexp: PCRE_INCLUDE
    line: PCRE_INCLUDE=/epics/support/PCRE/include

comment_out:
  - path: Makefile
    regexp: streamApp
  - path: Makefile
    regexp: pdf

tasks:
  - path: pcre-build.yml
